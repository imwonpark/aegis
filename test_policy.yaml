apiVersion: aegis.io/v1
kind: Policy
metadata:
  name: test-policy
  description: Test policy
spec:
  rules:
  - name: test-rule
    selector:
      agent_type: thermostat
      agent_id: thermo-1
      action_name: set_temperature
    conditions:
    - context_field: action.parameters.temperature_celsius
      operator: gt
      value: 24
    result:
      action: deny
      message: Temperature too high
